<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MORU 데모</title>
  <meta name="description" content="육아기록 기반 AI 영유아 발달 관찰 시스템 MORU의 웹 데모 (가상 데이터)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F6F68'/%3E%3Cpath d='M8 21c2-6 5-9 8-9s6 3 8 9' stroke='%23FFF6E5' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10' r='2.4' fill='%23F2B65A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <a class="brand" href="#/clues" aria-label="MORU 처음 화면">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M8 21c2-6 5-9 8-9s6 3 8 9" stroke="#FFF6E5" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="16" cy="10" r="2.4" fill="#F2B65A"/></svg>
        </span>
        <span><b>MORU</b><small>육아기록 발달 관찰</small></span>
      </a>
      <div class="child-chip" id="childChip"></div>
      <nav class="nav" id="nav"></nav>
      <p class="side-note">모든 데이터는 가상 예시입니다. 점수는 참고 평가값이며 진단이 아닙니다.</p>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="주요 화면"></nav>
  <div class="sheet" id="sheet" hidden></div>
  <div class="drawer-backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
